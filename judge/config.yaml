          \ equivalences.\n\nGrading principle, which decides every case the rules above leave open: an\
          \ answer is correct when a buyer of this data (a sales team assigning the company to a territory)\
          \ would act the same as with the reference location, and wrong when they would act differently.\
          \ Use your knowledge of geography only to tell whether two places lie in the same metropolitan\
          \ area.\n- Same metropolitan area is correct in either direction, a suburb for its core city or\
          \ the core city for its suburb.\n- A different metropolitan area is wrong, even when it is nearby\
          \ or in the same state."
