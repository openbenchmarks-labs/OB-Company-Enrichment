name: OB-Company-Enrichment
serves: Buyers choosing a company-data tool or research API who need each company's headquarters, industry, employee band, founding year, and LinkedIn URL.
win: More of the five company fields match ground truth, across more companies, than the other setups.
obkit: 0.3.0
sets:
  public:
    path: data/sample.jsonl
question_id: domain
split_axes:
- industry
split_gap_max: 0.1
window_hours: 24
concurrency: 4
repeats: 1
budget_usd: 0
refresh_days: 30
not_measured_max: 0.1
judge_error_max: 0.05
hooks:
  selftest: python -B -m harness.run selftest --tasks data/sample.jsonl
  answer: harness.obkit:answer
  contract: harness.obkit:contract
  probe: harness.obkit:probe
  grade: judge.obkit:grade
