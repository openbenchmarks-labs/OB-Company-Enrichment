tool: seltz
name: Seltz
env:
- SELTZ_API_KEY
setups:
  seltz-companies:
    class: main
    endpoint: POST https://api.seltz.ai/v1/answer
    settings:
      scope: companies
      response_format: json_schema
      output_schema: enrichment
      max_workers: 6
    pricing:
      usd: 0.006
      unit: request
      source: https://docs.seltz.ai/changelog/2026-07-answer-pro
      note: Answer, Base tier, $6 per 1,000. The request names no tier, and an unset tier runs Base.
