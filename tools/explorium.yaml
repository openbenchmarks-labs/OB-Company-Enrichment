tool: explorium
name: Explorium
env:
- EXPLORIUM_API_KEY
setups:
  explorium:
    class: main
    endpoint: POST https://api.explorium.ai/v1/businesses/match, then POST https://api.explorium.ai/v1/businesses
    settings:
      fetch:
        mode: full
      max_workers: 1
    pricing:
      usd: 0.04
      unit: credit
      source: https://www.explorium.ai/pricing/
      note: 'A usage proxy: $99.99 for 2,500 credits.'
