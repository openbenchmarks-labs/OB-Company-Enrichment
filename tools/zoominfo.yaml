tool: zoominfo
name: ZoomInfo
setups:
  zoominfo:
    class: main
    endpoint: CLI gtm companies enrich --file <domains.json> --format json
    settings:
      fields:
      - name
      - website
      - domainList
      - city
      - state
      - country
      - primaryIndustry
      - industries
      - employeeCount
      - employeeRange
      - foundedYear
      - socialMediaUrls
      domains_per_call: 10
      seconds_between_requests: 2
      max_workers: 1
    pricing:
      usd: 0.35
      unit: new company record
      source: https://gtm.ai/pricing
    note: Runs the gtm CLI, which uses its own sign-in, so there is no API key.
