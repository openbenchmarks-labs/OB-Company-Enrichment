tool: riveter
name: Riveter
env:
- RIVETER_API_KEY
setups:
  riveter-enrich:
    class: main
    endpoint: POST https://api.riveterhq.com/v1/enrich
    settings:
      budget_credits_per_row: 30
      additional_tools:
      - linkedin_company_profile
      - linkedin_company_job_count
      - linkedin_company_posts
      output_schema: enrichment
      max_workers: 25
    pricing:
      usd: 0.025
      unit: credit
      source: https://www.riveterhq.com/pricing
      note: Self-Serve list price per credit, checked 2026-11-04. Credits per company vary; Riveter bills the credits spent, up to the row budget of 30.
    note: The recipe is saved once per run with POST /v1/enrichments (free); each company is one row. At most 25 rows run at a time per account, and kickoffs stay under 28 a minute.
