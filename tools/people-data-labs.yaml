tool: people-data-labs
name: People Data Labs
env:
- PEOPLE_DATA_LABS_API_KEY
setups:
  people-data-labs:
    class: main
    endpoint: GET https://api.peopledatalabs.com/v5/company/enrich
    settings:
      params:
        website: <domain>
      max_workers: 1
    pricing:
      usd: 0.1
      unit: successful match
      source: https://www.peopledatalabs.com/pricing/company
