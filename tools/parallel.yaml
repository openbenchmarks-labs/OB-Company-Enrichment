tool: parallel
name: Parallel
env:
- PARALLEL_API_KEY
setups:
  parallel-task:
    class: main
    endpoint: POST https://api.parallel.ai/v1/tasks/runs
    settings:
      processor: core
      output_schema: enrichment
      max_workers: 8
    pricing:
      usd: 0.025
      unit: run
      source: https://docs.parallel.ai/getting-started/pricing
