tool: predictleads
name: PredictLeads
env:
- PREDICTLEADS_API_KEY
- PREDICTLEADS_API_TOKEN
setups:
  predictleads-enrichment:
    class: main
    endpoint: GET https://predictleads.com/api/v3/extended_companies/<domain>
    settings:
      max_workers: 1
    pricing:
      usd: 0.04
      unit: credit
      source: https://predictleads.com/pricing
      note: 100 free credits per month, then a $40 monthly minimum.
