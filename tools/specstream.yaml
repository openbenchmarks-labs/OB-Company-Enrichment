tool: specstream
name: SpecStream
env:
- SPECSTREAM_API_KEY
setups:
  specstream-search-web:
    class: main
    endpoint: POST https://api.specstream.ai/v1/web-search
    env:
    - SPECSTREAM_API_KEY
    - OPENAI_API_KEY
    settings:
      num: 10
      extractor:
        model: gpt-5.6-terra
        reasoning_effort: medium
      max_workers: 6
    pricing:
      usd: 0.005
      unit: request
      source: https://specstream.ai/pricing
      note: "Web Search, $5 per 1,000 requests of up to 10 results; a search with no results is not billed (checked 2026-11-26). Extraction-model tokens are billed on top. Docs: https://specstream.ai/docs/search-api"
