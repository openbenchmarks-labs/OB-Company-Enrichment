tool: company-enrich
name: CompanyEnrich
env:
- COMPANY_ENRICH_API_KEY
setups:
  company-enrich:
    class: main
    endpoint: GET https://api.companyenrich.com/companies/enrich
    settings:
      params:
        domain: <domain>
      max_workers: 1
    pricing:
      usd: 0.0098
      unit: credit
      source: https://companyenrich.com/pricing
      note: 1 credit per call. $49 per month for 5,000 credits.
